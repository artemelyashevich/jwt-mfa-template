<th:block th:fragment="subject">Добро пожаловать!</th:block>
<th:block th:fragment="body">
<h1 style="margin:0 0 12px; font-size:22px; line-height:1.3;">
    Добро пожаловать, <span th:text="${user.displayName}">пользователь</span>!
</h1>
<p style="margin:0 0 16px;">
    Ваш email <b th:text="${user.email}">user@example.com</b> подтверждён, аккаунт активен.
</p>
</th:block>
