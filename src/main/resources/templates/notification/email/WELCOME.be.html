<th:block th:fragment="subject">Сардэчна запрашаем!</th:block>
<th:block th:fragment="body">
<h1 style="margin:0 0 12px; font-size:22px; line-height:1.3;">
    Сардэчна запрашаем, <span th:text="${user.displayName}">карыстальнік</span>!
</h1>
<p style="margin:0 0 16px;">
    Ваш email <b th:text="${user.email}">user@example.com</b> пацверджаны, акаўнт актыўны.
</p>
<p style="margin:0 0 20px;">Рады, што вы з намі. Заходзьце ў LapaLink — усё ўжо гатова.</p>
</th:block>
