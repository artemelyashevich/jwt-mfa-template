<th:block th:fragment="subject">Код для ўваходу</th:block>
<th:block th:fragment="body">
<h1 style="margin:0 0 12px; font-size:22px; line-height:1.3;">Пацвердзіце ўваход</h1>
<p style="margin:0 0 20px;">
    Вітаем, <span th:text="${user.displayName}">карыстальнік</span>!
    Увядзіце гэты код, каб увайсці ў акаўнт:
</p>
<div style="margin:0 0 20px; padding:18px 0 18px 10px; text-align:center; background-color:#fff4ec; border:1px dashed #f2711c; border-radius:12px; font-family:Menlo, Consolas, monospace; font-size:34px; font-weight:700; letter-spacing:10px; color:#1f1d1a;"
     th:text="${code}">000000</div>
<p style="margin:0; font-size:14px; color:#6b665f;">
    Код дзейнічае <span th:text="${ttlMinutes}">1</span> хв. Нікому яго не паведамляйце.<br>
    Калі вы не спрабавалі ўвайсці, змяніце пароль.
</p>
</th:block>
