spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: jwt-demo
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jwt_demo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      admin.email: ${ADMIN_EMAIL:admin@jwt-demo.local}
      admin.name: ${ADMIN_NAME:Administrator}
      admin.password-hash: ${ADMIN_PASSWORD_HASH}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

app:
  auth:
    access-secret: ${ACCESS_SECRET}
    refresh-secret: ${REFRESH_SECRET}
    access-token-expiration-seconds: ${ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
    refresh-token-expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  notification:
    email-from: ${MAIL_FROM:no-reply@jwt-demo.local}
