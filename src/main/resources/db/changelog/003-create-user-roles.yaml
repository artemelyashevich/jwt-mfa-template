databaseChangeLog:
  - changeSet:
      id: 003-create-user-roles
      author: elyashevich
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_roles_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: role_code
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_roles_role
                    references: roles(code)
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_code
            constraintName: pk_user_roles
