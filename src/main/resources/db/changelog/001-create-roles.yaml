databaseChangeLog:
  - changeSet:
      id: 001-create-roles
      author: elyashevich
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: code
                  type: VARCHAR(32)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-insert-roles
      author: elyashevich
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: code, value: USER }
              - column: { name: description, value: Regular user }
        - insert:
            tableName: roles
            columns:
              - column: { name: code, value: MODERATOR }
              - column: { name: description, value: Content moderator }
        - insert:
            tableName: roles
            columns:
              - column: { name: code, value: ADMIN }
              - column: { name: description, value: Administrator }
